name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pandas numpy scikit-learn flask faiss-cpu

      - name: Run unit tests
        run: pytest -q tests/

      - name: Verify CLI and imports
        run: |
          python cli_recommender.py --help
          python cli_recommender.py --genres --no-faiss
          python -c "from utils.model import ImprovedAutoencoder; print('model ok')"
          python -c "from utils.metrics import precision_at_k; print('metrics ok')"
          python -c "from app import app; print('app ok')"
